<!DOCTYPE html>
<html>
   <head>
      <meta charset="UTF-8">
      <link rel="stylesheet" href="../estilo.css">
   </head>

   <body>
      <div>
         <button id="botaoCarregar">Carregando cervejas...</button>
      </div>

      <div id="cervejasDiv"></div>

      <script>
         let cervejas = [
            {
               name: "Guiness",
               alcohol: "10%",
               style: "Imperial Stout",
               ibu: "60"
            },
            {
               name: "Desperados",
               alcohol: "6%",
               style: "Lager",
               ibu: "20"
            },
            {
               name: "Becks",
               alcohol: "5%",
               style: "Pilsen",
               ibu: "25"
            }
         ];

         const carregarDiv = (
            cs,
            id = "cervejasDiv",
            hNome = "Nome",
            hAlcool = "Álcool",
            hEstilo = "Estilo",
            hAmargor = "Amargor",
            pNome = "name",
            pAlcool = "alcohol",
            pEstilo = "style",
            pAmargor = "ibu"
         ) => {
            const div = document.getElementById(id);

            const itensHtml = cs.map(item =>
               `<tr>
                  <td>${item[pNome]}</td>
                  <td>${item[pAlcool]}</td>
                  <td>${item[pEstilo]}</td>
                  <td>${item[pAmargor]}</td>
               </tr>`
            );

            div.innerHTML = `
               <table class="tabela-cervejas">
                  <tr>
                     <th>${hNome}</th>
                     <th>${hAlcool}</th>
                     <th>${hEstilo}</th>
                     <th>${hAmargor}</th>
                  </tr>
                  ${itensHtml.join("\n")}
               </table>
            `;
         };

         let botao = document.getElementById("botaoCarregar");

         botao.addEventListener("click", () => carregarDiv(cervejas));
      </script>
   </body>
</html>
