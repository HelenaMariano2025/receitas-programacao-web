<!DOCTYPE html>
<html>
   <head>
      <meta charset="UTF-8">
   </head>

   <body>
      <div>
         <button id="botaoCarregar">Carregando cervejas...</button>
      </div>

      <div id="cervejasDiv"></div>

      <script>
         let cervejas = [
            {
               name: "Guiness",
               alcohol: "10%"
            },
            {
               name: "Desperados",
               alcohol: "6%"
            },
            {
               name: "Becks",
               alcohol: "5%"
            }
         ];

         const carregarDiv = cs => {
            const div = document.getElementById("cervejasDiv");

            const itensHtml = cs.map(item =>
               `<tr>
                  <td>${item["name"]}</td>
                  <td>${item["alcohol"]}</td>
               </tr>`
            );

            div.innerHTML = `
               <table>
                  <tr>
                     <th>Nome</th>
                     <th>Álcool</th>
                  </tr>
                  ${itensHtml.join("\n")}
               </table>
            `;
         };

         let botao = document.getElementById("botaoCarregar");

         botao.addEventListener("click", () => carregarDiv(cervejas));
      </script>
   </body>
</html>
