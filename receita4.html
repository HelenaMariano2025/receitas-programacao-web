<!DOCTYPE html>
<html>   
   <head>
      <meta charset="UTF-8">  
      <link rel="stylesheet" type="text/css" href="estilo.css">
   </head>
  
   <body>
        <div id="meuAmor"></div>

        <div>
            <button id="botaoCarregar">Carregar Cervejas</button>
            <button id="botaoOrdenar">Ordenar</button>
            <button id="botaoEmbaralhar">Embaralhar</button>
        </div>

    <script>
        let cervejas = [
            "Guinness",
            "Heineken",
            "Budweiser",
            "Stella Artois",
            "Corona",
            "Beck's",
            "Paulaner",
            "Hoegaarden",
            "Carlsberg",
            "Peroni"
        ]; 
        function transformar(item){
            return `<tr><td>${item}</td></tr>`
        }

        function mostrarCervejas() {
            let div = document.getElementById("meuAmor");

            let cervejasHtml = cervejas.map(transformar);

            div.innerHTML = `
                <table class="tabela-cervejas">
                    <tr>
                        <th>Cerveja</th>
                    </tr>
                    ${cervejasHtml.join("\n")}
                </table>
            `;
        }


        function carregarDiv(){
            let div = document.getElementById("meuAmor");

            if (div.innerHTML === "") {

                div.classList.add("fade");

                setTimeout(function() {
                    mostrarCervejas();
                    div.classList.remove("fade");
                }, 300);

            } else {

                div.classList.add("fade");

                setTimeout(function() {
                    div.innerHTML = "";
                    div.classList.remove("fade");
                }, 300);
            }
        }

        function ordenarCervejas() {
            cervejas.sort();
            mostrarCervejas();

        }

        function embaralharCervejas() {
            cervejas.sort(() => Math.random() - 0.5);
            mostrarCervejas();
        }

        let botao = document.getElementById("botaoCarregar")
        botao.addEventListener("click", carregarDiv)   
        
        let botaoOrdenar = document.getElementById("botaoOrdenar");
        botaoOrdenar.addEventListener("click", ordenarCervejas);

        let botaoEmbaralhar = document.getElementById("botaoEmbaralhar");
        botaoEmbaralhar.addEventListener("click", embaralharCervejas);


    </script>

   </body>
</html>
